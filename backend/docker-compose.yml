version: '3.8'
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: smart_leads
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build: .
    command: npm run dev
    ports:
      - 5000:5000
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=smart_leads
      - DB_USER=root
      - DB_PASSWORD=yourpassword
      - JWT_SECRET=your_very_long_secret_key_here
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mysql
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
volumes:
  mysql-data: